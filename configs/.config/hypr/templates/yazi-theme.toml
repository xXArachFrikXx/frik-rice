# Generated by scheme-apply.sh — do not edit manually.
# Edit ~/.config/hypr/templates/yazi-theme.toml instead.

[manager]
cwd = {{ fg = "{yazi_cwd}" }}

hovered         = {{ fg = "{yazi_bg}", bg = "{yazi_selected}", bold = true }}
preview_hovered = {{ underline = true }}

find_keyword  = {{ fg = "{yazi_selected}", bold = true }}
find_position = {{ fg = "{yazi_cwd}", bg = "reset", bold = true, italic = true }}

marker_copied   = {{ fg = "{yazi_selected}", bg = "{yazi_selected}" }}
marker_cut      = {{ fg = "{rmpc_accent}", bg = "{rmpc_accent}" }}
marker_selected = {{ fg = "{yazi_cwd}", bg = "{yazi_cwd}" }}

tab_active   = {{ fg = "{yazi_bg}", bg = "{yazi_selected}", bold = true }}
tab_inactive = {{ fg = "{yazi_fg}", bg = "{yazi_bg}" }}
tab_width    = 1

[status]
separator_open  = ""
separator_close = ""
separator_style = {{ fg = "{yazi_selected}", bg = "{yazi_bg}" }}

mode_normal = {{ fg = "{yazi_bg}", bg = "{yazi_selected}", bold = true }}
mode_select = {{ fg = "{yazi_bg}", bg = "{yazi_cwd}",      bold = true }}
mode_unset  = {{ fg = "{yazi_bg}", bg = "{yazi_fg}",       bold = true }}

progress_label  = {{ bold = true }}
progress_normal = {{ fg = "{yazi_selected}", bg = "{yazi_bg}" }}
progress_error  = {{ fg = "{rmpc_accent}",   bg = "{yazi_bg}" }}

permissions_t = {{ fg = "{yazi_selected}" }}
permissions_r = {{ fg = "{yazi_cwd}" }}
permissions_w = {{ fg = "{rmpc_accent}" }}
permissions_x = {{ fg = "{yazi_fg}" }}
permissions_s = {{ fg = "{yazi_fg}" }}

[input]
border   = {{ fg = "{yazi_selected}" }}
title    = {{ fg = "{yazi_selected}" }}
value    = {{ fg = "{yazi_fg}" }}
selected = {{ reversed = true }}

[select]
border   = {{ fg = "{yazi_selected}" }}
active   = {{ fg = "{yazi_selected}", bold = true }}
inactive = {{ fg = "{yazi_fg}" }}

[tasks]
border  = {{ fg = "{yazi_selected}" }}
title   = {{ fg = "{yazi_selected}" }}
hovered = {{ underline = true }}

[which]
mask    = {{ bg = "{yazi_bg}" }}
cand    = {{ fg = "{yazi_cwd}" }}
rest    = {{ fg = "{yazi_fg}" }}
desc    = {{ fg = "{yazi_selected}" }}
separator       = "  "
separator_style = {{ fg = "{yazi_fg}" }}

[notify]
title_info  = {{ fg = "{yazi_cwd}" }}
title_warn  = {{ fg = "{yazi_selected}" }}
title_error = {{ fg = "{rmpc_accent}" }}

[help]
on      = {{ fg = "{yazi_cwd}" }}
exec    = {{ fg = "{yazi_selected}" }}
desc    = {{ fg = "{yazi_fg}" }}
hovered = {{ bg = "{yazi_bg}", bold = true }}
footer  = {{ fg = "{yazi_bg}", bg = "{yazi_fg}" }}
